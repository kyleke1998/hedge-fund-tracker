name: Regime Signals Refresh

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US close, once Yahoo has published the day's bar.
    - cron: "15 23 * * 1-5"
  push:
    # New 13F data or a classification change reshapes regime.csv, so rebuild as
    # soon as it lands on master (e.g. after merging automated/filings-fetch).
    branches: [master]
    paths:
      - "database/20*Q*/**"
      - "database/stocks.csv"
      - "database/sector_hierarchy.csv"
      - "app/analysis/regime.py"
      - "app/analysis/correlation.py"
      - "app/analysis/momentum.py"

concurrency:
  group: regime-refresh
  cancel-in-progress: false

jobs:
  regime-refresh:
    runs-on: ubuntu-latest

    env:
      PIPENV_VENV_IN_PROJECT: "1"

    permissions:
      contents: write
      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # Pages deploy has to be dispatched explicitly.
      actions: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pipenv"
          cache-dependency-path: "**/Pipfile.lock"

      - name: Cache pipenv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv virtualenv
          python -m virtualenv .venv
          pipenv install --dev

      # Exits non-zero when a series was kept because its rebuild failed or came
      # back less complete; the others are still committed below.
      - name: Refresh regime signals
        id: refresh
        continue-on-error: true
        run: pipenv run refresh-regime

      - name: Flag series that were not refreshed
        if: steps.refresh.outcome == 'failure'
        run: echo "::warning title=Regime refresh::Some regime series kept their published copy - see the 'Refresh regime signals' log."

      - name: Stage and check for real changes
        id: changes
        run: |
          git add database/regime.csv database/correlation.csv database/momentum.csv
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "Regime signals unchanged."
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
            git --no-pager diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.no_changes == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: Refresh regime signals ($(date -u +'%Y-%m-%d'))"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref master
